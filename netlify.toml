[build]
  command = "npm run build"
  publish = "build"

# Proxy Traccar REST API calls to the official Traccar demo server.
# This app is only the front-end; without a backend, /api requests would
# fall through to index.html and fail with "Unexpected token '<'".
[[redirects]]
  from = "/api/*"
  to = "https://demo.traccar.org/api/:splat"
  status = 200
  force = true

# Single-page app fallback so client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
